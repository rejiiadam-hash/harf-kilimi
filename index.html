<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7A1F2B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Harf Kilimi</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237A1F2B'/%3E%3Crect x='10' y='12' width='44' height='10' fill='%23C8553D'/%3E%3Crect x='10' y='22' width='44' height='10' fill='%23E0A526'/%3E%3Crect x='10' y='32' width='44' height='10' fill='%232E6E65'/%3E%3Crect x='10' y='42' width='44' height='10' fill='%233B4A8C'/%3E%3Cpath d='M32 14l6 6-6 6-6-6zM32 34l6 6-6 6-6-6z' fill='%23F4E9D8'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Harf Kilimi">
<style>
:root{
  --red:#7A1F2B; --cream:#F4E9D8; --ink:#2B1B17;
  --terra:#C8553D; --saffron:#E0A526; --teal:#2E6E65; --indigo:#3B4A8C;
  --plum:#8C3B5E; --olive:#6B8F3A; --apricot:#D98C5F; --night:#1F3A4D;
  --nazar:#1E5BB8; --ok:#4C9A5B; --err:#D64545; --gold:#E8B923;
  --cell:36px; --tile:58px; --gap:5px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --dia:polygon(0 50%,50% 0,100% 50%,50% 100%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--red)}
body{font-family:system-ui,"Roboto","Noto Sans",sans-serif;color:var(--cream);touch-action:manipulation;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 80% at 50% 30%,var(--bg1,#8e2735) 0%,var(--red) 55%,var(--bg3,#5c1520) 100%);transition:background .4s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:var(--patop,.06);z-index:0;
  background:var(--pat,repeating-linear-gradient(45deg,var(--cream) 0 2px,transparent 2px 22px),
             repeating-linear-gradient(-45deg,var(--cream) 0 2px,transparent 2px 22px));}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
#app{position:fixed;inset:0;z-index:1}
.screen{position:absolute;top:var(--sat);bottom:var(--sab);left:var(--sal);right:var(--sar);display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}
.serif{font-family:"Georgia",serif;letter-spacing:.08em}

/* ---------- common bits ---------- */
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;flex:none;position:relative;vertical-align:middle;
  background:radial-gradient(circle at 35% 30%,#fff3b8 0 10%,var(--gold) 12% 62%,#b8860b 64%);
  box-shadow:inset 0 0 0 2px #a8770a,0 1px 2px rgba(0,0,0,.35)}
.coin::after{content:"";position:absolute;inset:5px;border-radius:50%;border:1.5px solid rgba(140,95,5,.7)}
.coin.sm{width:14px;height:14px}.coin.sm::after{inset:3px;border-width:1px}
.coinbox{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.28);padding:5px 12px 5px 6px;border-radius:999px;font-weight:800;font-size:17px;min-width:70px}
.coinbox.shake{animation:shake .4s}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;border-radius:14px;font-weight:800;font-size:18px;
  background:var(--terra);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s;min-height:52px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.teal{background:var(--teal)}.btn.indigo{background:var(--indigo)}.btn.saff{background:var(--saffron);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px rgba(43,27,23,.35)}
.iconbtn{width:44px;height:44px;border-radius:12px;background:rgba(0,0,0,.28);display:grid;place-items:center;flex:none}
.iconbtn:active{transform:scale(.94)}
.burger,.burger::before,.burger::after{display:block;width:20px;height:3px;border-radius:2px;background:var(--cream);position:relative}
.burger::before,.burger::after{content:"";position:absolute;left:0}
.burger::before{top:-7px}.burger::after{top:7px}
.back{width:12px;height:12px;border-left:3px solid var(--cream);border-bottom:3px solid var(--cream);transform:rotate(45deg);margin-left:4px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(43,27,23,.07);font-weight:700;font-size:16px;color:var(--ink);width:100%}
.tog .sw2{width:46px;height:26px;border-radius:13px;background:#bfae98;position:relative;transition:background .2s;flex:none}
.tog .sw2::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tog[aria-checked="true"] .sw2{background:var(--ok)}
.tog[aria-checked="true"] .sw2::after{transform:translateX(20px)}

/* mini kilim (logo, win, map) */
.kil{position:relative;display:flex;flex-direction:column;padding:7px 0;}
.kil::before,.kil::after{content:"";position:absolute;left:4%;right:4%;height:8px;
  background:repeating-linear-gradient(90deg,var(--cream) 0 2px,transparent 2px 5px)}
.kil::before{top:0}.kil::after{bottom:0}
.kil .ks{flex:1;position:relative;background:var(--c);min-height:4px;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.25)}
.kil .ks::after{content:"";position:absolute;inset:22% 0;background:rgba(244,233,216,.7);clip-path:var(--dia)}
.kil .ks:nth-child(even)::after{background:rgba(43,27,23,.45)}
.kil .ks:first-child{border-radius:4px 4px 0 0}.kil .ks:last-child{border-radius:0 0 4px 4px}

/* ---------- home ---------- */
#home{align-items:center;justify-content:center;padding:16px;gap:14px;overflow-y:auto}
.logo{width:150px;height:110px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35));transform:rotate(-3deg)}
.title{font-family:"Georgia",serif;letter-spacing:.08em;font-size:clamp(30px,9vw,44px);font-weight:700;text-align:center;line-height:1.05;
  text-shadow:0 3px 0 rgba(0,0,0,.3)}
.title small{display:block;font-size:13px;letter-spacing:.3em;opacity:.8;margin-top:6px;font-weight:400}
.stats{display:flex;gap:10px}
.stat{background:rgba(0,0,0,.25);border-radius:999px;padding:6px 14px;font-weight:700;display:flex;gap:6px;align-items:center;font-size:15px}
.homecard{background:var(--cream);color:var(--ink);border-radius:22px;padding:16px;width:min(100%,380px);display:flex;flex-direction:column;gap:10px;
  box-shadow:0 12px 30px rgba(0,0,0,.35);position:relative}
.homecard::before{content:"";position:absolute;left:14px;right:14px;top:-6px;height:6px;border-radius:3px 3px 0 0;
  background:repeating-linear-gradient(90deg,var(--terra) 0 10px,var(--saffron) 10px 20px,var(--teal) 20px 30px,var(--indigo) 30px 40px)}
.togrow{display:flex;gap:8px}
.togrow .tog{flex:1;padding:10px}

/* ---------- game ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;height:56px;padding:6px 12px;flex:none}
.lvl{font-family:"Georgia",serif;letter-spacing:.08em;font-size:20px;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.25);text-align:center;flex:1}
#loom{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:var(--gap);
  margin:0 10px;padding:12px 10px;border-radius:12px;position:relative;
  background:repeating-linear-gradient(90deg,rgba(244,233,216,.08) 0 1px,transparent 1px 9px),rgba(0,0,0,.2);
  box-shadow:inset 0 2px 12px rgba(0,0,0,.35)}
#loom::before,#loom::after{content:"";position:absolute;left:-4px;right:-4px;height:9px;border-radius:5px;
  background:linear-gradient(#a0703f,#6d4421);box-shadow:0 2px 3px rgba(0,0,0,.35)}
#loom::before{top:-2px}#loom::after{bottom:-2px}
.row{position:relative;display:flex;justify-content:center;padding:0}
.rowin{position:relative;display:flex;justify-content:center;padding:2px 8px}
.stripe{position:absolute;inset:0;border-radius:6px;clip-path:inset(0 100% 0 0);transition:clip-path .3s ease-out;
  background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,0) 3px,rgba(0,0,0,0) calc(100% - 3px),rgba(0,0,0,.25)),
    repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 2px,transparent 2px 7px),var(--c)}
.stripe::before{content:"";position:absolute;left:0;right:0;top:0;bottom:0;opacity:.55;
  background:linear-gradient(135deg,var(--cream) 25%,transparent 25%) -5px 0/10px 10px repeat-x,
             linear-gradient(225deg,var(--cream) 25%,transparent 25%) -5px 0/10px 10px repeat-x,
             linear-gradient(45deg,var(--cream) 25%,transparent 25%) -5px 100%/10px 10px repeat-x,
             linear-gradient(315deg,var(--cream) 25%,transparent 25%) -5px 100%/10px 10px repeat-x}
.stripe::after{content:"";position:absolute;left:0;right:0;top:24%;bottom:24%;
  background:repeating-linear-gradient(45deg,rgba(43,27,23,.45) 0 2px,transparent 2px 6px),rgba(244,233,216,.75);clip-path:var(--dia)}
.row.solved .stripe{clip-path:inset(0 0 0 0)}
.row.pulse{animation:pulse .45s}
.cells{display:flex;gap:4px;position:relative;z-index:1}
.cell{width:var(--cell);height:var(--cell);border-radius:6px;display:grid;place-items:center;font-weight:800;
  font-size:calc(var(--cell)*.6);line-height:1;color:var(--ink);background:rgba(244,233,216,.13);
  border:2px solid rgba(244,233,216,.32)}
.cell.rev{background:rgba(244,233,216,.72);color:rgba(43,27,23,.45);border-color:rgba(244,233,216,.8);animation:flip .18s ease-out backwards}
.cell.on{background:var(--cream);color:var(--ink);border-color:rgba(43,27,23,.4);box-shadow:0 2px 0 rgba(0,0,0,.25);animation:flip .18s ease-out backwards}
#pillwrap{height:44px;flex:none;display:grid;place-items:center}
#pill{min-width:56px;height:38px;padding:0 18px;border-radius:999px;display:grid;place-items:center;font-weight:800;font-size:22px;
  letter-spacing:.08em;background:var(--cream);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.25);opacity:0;transform:scale(.85);
  transition:opacity .15s,transform .15s,background .15s,color .15s}
#pill.show{opacity:1;transform:none}
#pill.bad{background:var(--err);color:#fff;animation:shake .35s}
#pill.ok{background:var(--ok);color:#fff}
#pill.bonus{background:var(--gold);color:var(--ink)}
#pill.dup{background:#b49a7e;color:var(--ink)}
#spin{position:relative;flex:none;touch-action:none;margin:0 auto;width:100%}
#ring{position:absolute;border-radius:50%;
  background:radial-gradient(circle,rgba(244,233,216,.12) 0 40%,rgba(0,0,0,.18) 70%);
  border:2px dashed rgba(244,233,216,.28);box-shadow:inset 0 0 30px rgba(0,0,0,.25)}
#thread{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#thread polyline{fill:none;stroke:var(--saffron);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
.tile{position:absolute;width:var(--tile);height:var(--tile);border-radius:50%;display:grid;place-items:center;pointer-events:none;
  font-weight:800;font-size:calc(var(--tile)*.46);line-height:1;color:var(--ink);border:3px solid var(--ink);
  background:radial-gradient(circle at 35% 30%,#fffaf0,var(--cream) 55%,#e4d1b2);
  box-shadow:0 4px 0 rgba(0,0,0,.22),0 7px 12px rgba(0,0,0,.25);
  transition:left .25s ease,top .25s ease,transform .1s,background .1s}
.tile.sel{transform:scale(1.12);background:var(--saffron)}
.tile.nazar{border-color:var(--nazar);box-shadow:inset 0 0 0 3px #fff,0 0 0 3px var(--nazar),0 7px 12px rgba(0,0,0,.3)}
.tile.nazar::after{content:"";position:absolute;width:14px;height:14px;right:-5px;top:-5px;border-radius:50%;
  background:radial-gradient(circle,#111 0 22%,#fff 24% 42%,#7cc0ff 44% 62%,var(--nazar) 64%);box-shadow:0 0 0 1.5px #fff}
#shuf{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.3);color:var(--cream);font-size:28px;font-weight:700;
  display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(244,233,216,.25)}
#shuf:active{transform:scale(.92)}
.bottombar{display:flex;gap:8px;padding:6px 10px 10px;flex:none;height:72px}
.hbtn{flex:1;border-radius:14px;background:var(--cream);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.28);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:14px;min-width:0}
.hbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.hbtn .cost{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:700;opacity:.8}
.jarbtn{flex:0 0 66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:800}
.jar{width:30px;height:34px;border:3px solid var(--cream);border-top-width:2px;border-radius:6px 6px 12px 12px;position:relative;overflow:hidden;background:rgba(0,0,0,.2)}
.jar::before{content:"";position:absolute;left:3px;right:3px;top:0;height:3px;background:rgba(244,233,216,.6)}
.jar i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(var(--gold),#c48f10);transition:height .4s}
.jarbtn.bump .jar{animation:pulse .45s}
.fly{position:fixed;z-index:60;pointer-events:none;font-weight:800;color:var(--ink);background:var(--gold);padding:4px 10px;border-radius:999px;
  transition:transform .6s cubic-bezier(.5,-.3,.7,1),opacity .6s;left:0;top:0}
.float{position:fixed;z-index:60;pointer-events:none;font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4);animation:floatUp .9s ease-out forwards}
.float.nz{color:#9fd0ff}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(30,8,12,.72);padding:16px;
  padding-top:calc(16px + var(--sat));padding-bottom:calc(16px + var(--sab))}
.ov.on{display:grid;animation:fade .2s}
.panel{background:var(--cream);color:var(--ink);border-radius:22px;padding:20px 18px;width:min(100%,380px);max-height:100%;overflow:auto;
  display:flex;flex-direction:column;gap:10px;box-shadow:0 16px 40px rgba(0,0,0,.45);position:relative}
.panel h2{font-family:"Georgia",serif;letter-spacing:.08em;text-align:center;font-size:22px;margin-bottom:4px}
.panel::before{content:"";position:absolute;left:18px;right:18px;top:8px;height:5px;border-radius:3px;
  background:repeating-linear-gradient(90deg,var(--terra) 0 10px,var(--saffron) 10px 20px,var(--teal) 20px 30px,var(--indigo) 30px 40px);opacity:.8}
#winKilim{width:150px;height:170px;margin:4px auto;perspective:600px}
#winKilim .kil{width:100%;height:100%;transform-origin:50% 0;animation:roll 1.1s .2s cubic-bezier(.3,1.4,.5,1) both}
#winKilim .ks{transform-origin:50% 0;animation:weaveIn .35s ease-out both}
.stars{display:flex;justify-content:center;gap:8px;font-size:40px;line-height:1}
.stars span{color:#d8c7ae;transform:scale(.6);transition:transform .25s cubic-bezier(.3,1.8,.5,1),color .2s}
.stars span.on{color:var(--gold);transform:scale(1);text-shadow:0 2px 0 #a8770a}
.earn{display:flex;justify-content:center;align-items:center;gap:6px;font-weight:800;font-size:20px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
#toast{position:fixed;left:50%;top:calc(10px + var(--sat));transform:translate(-50%,-80px);z-index:80;background:var(--ink);color:var(--cream);
  padding:10px 18px;border-radius:999px;font-weight:700;font-size:15px;box-shadow:0 6px 16px rgba(0,0,0,.4);transition:transform .25s;
  width:max-content;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{transform:translate(-50%,0)}

/* help */
.hcard{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;touch-action:pan-y}
.hcard p{font-size:18px;line-height:1.4;font-weight:600}
.hart{height:110px;display:grid;place-items:center}
.dots{display:flex;justify-content:center;gap:8px}
.dots i{width:9px;height:9px;border-radius:50%;background:#cbb89c;transition:background .2s,transform .2s}
.dots i.on{background:var(--terra);transform:scale(1.25)}
.hnav{display:flex;gap:10px}
.hnav .btn{flex:1}
.demo-tiles{position:relative;width:170px;height:100px}
.demo-tiles .tile{position:absolute;--tile:46px}
.demo-hint{display:flex;gap:10px}
.demo-hint .hbtn{width:80px;height:58px;flex:none}

/* shop */
#shopList{flex:1;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:6px 14px 24px;align-content:start}
.th{border-radius:16px;background:var(--cream);color:var(--ink);padding:8px;display:flex;flex-direction:column;gap:8px;box-shadow:0 3px 0 rgba(0,0,0,.25);text-align:center}
.th .pv{height:96px;border-radius:11px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.th .pv i{position:absolute;inset:0;opacity:var(--patop);background:var(--pat)}
.th .pv b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:3px}
.th .pv b span{width:18px;height:18px;border-radius:4px;background:var(--cream);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.th .nm{font-weight:800;font-size:15px}
.th .act{border-radius:10px;padding:8px 6px;font-weight:800;font-size:15px;display:flex;gap:6px;align-items:center;justify-content:center;background:var(--terra);color:#fff;min-height:40px}
.th .act.own{background:var(--teal)}
.th .act.sel{background:transparent;color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.th .act.no{background:#bfae98;color:#fff}
.th.cur{box-shadow:0 0 0 3px var(--gold),0 3px 0 rgba(0,0,0,.25)}

/* map */
.maphead{display:flex;align-items:center;gap:10px;padding:8px 12px;flex:none;height:60px}
.maphead h1{flex:1;font-family:"Georgia",serif;letter-spacing:.08em;font-size:24px}
.maphead .cnt{font-weight:700;opacity:.85}
#grid{flex:1;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;display:grid;grid-template-columns:repeat(5,1fr);
  gap:10px;padding:10px 14px 24px;align-content:start}
.sw{position:relative;aspect-ratio:3/4;border-radius:10px;background:rgba(0,0,0,.22);display:flex;flex-direction:column;align-items:stretch;padding:2px 4px 4px;
  box-shadow:inset 0 0 0 2px rgba(244,233,216,.12)}
.sw .kil{flex:1;padding:5px 0}
.sw .kil::before,.sw .kil::after{height:5px}
.sw .num{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:800;font-size:15px;color:#fff;text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.7)}
.sw .st{text-align:center;font-size:11px;color:var(--gold);letter-spacing:1px;line-height:1;height:12px}
.sw .st .off{color:rgba(244,233,216,.3)}
.sw.cur{background:var(--saffron);animation:breath 1.4s ease-in-out infinite;box-shadow:0 0 0 3px var(--cream)}
.sw.cur .num{color:var(--ink);text-shadow:none;font-size:20px}
.sw.locked{opacity:.4;filter:grayscale(1)}
.sw.locked svg{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:22px;height:22px}
.sw.locked .num{top:80%;font-size:12px}
.mapfoot{grid-column:1/-1;text-align:center;opacity:.75;font-size:14px;padding-top:6px}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes pulse{0%,100%{transform:scale(1)}40%{transform:scale(1.06)}}
@keyframes flip{from{transform:perspective(200px) rotateX(90deg)}to{transform:perspective(200px) rotateX(0)}}
@keyframes floatUp{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-50px);opacity:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes roll{0%{transform:rotateX(75deg) scaleY(.2)}60%{transform:rotateX(-8deg) scaleY(1.03)}100%{transform:none}}
@keyframes weaveIn{from{transform:scaleY(0) rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (min-height:760px){ .bottombar{height:80px} #pillwrap{height:52px} }
@media (max-height:700px){ .topbar{height:48px;padding:4px 10px} .iconbtn{width:40px;height:40px} .bottombar{height:62px;padding:4px 10px 8px} #pillwrap{height:40px} #pill{height:34px;font-size:20px} }
@media (min-width:600px){ .lvl{font-size:24px} }
</style>

function prep(w){const c=cnt(w);const nz=[];for(let i=0;i<c.length;i++)if(c[i])nz.push(i);return{w,c,nz,len:w.length,k:[...w].sort().join('')};}
function fits(o,pc,plen){if(o.len>plen)return false;for(const i of o.nz)if(o.c[i]>pc[i])return false;return true;}

const FALLBACK={lang:'tr',version:1,
  targets:['KALEM','ELMA','KALE','MAL','KEL','ALEM','KİTAP','KATİP','KİT','TAP','KAP','TİP','KARIN','KAR','KIR','ARI','NAR','ARK',

  extra:['AMEL','KELAM','KIRA','RAKI']};

function prepWords(src){
  const norm=a=>Array.isArray(a)?a.map(w=>trUp(String(w).trim())).filter(w=>WORD_RE.test(w)):[];
  const T=[...new Set(norm(src&&src.targets))];
  const ts=new Set(T);
  const E=[...new Set(norm(src&&src.extra))].filter(w=>!ts.has(w));
  return{T,E};
}

/* 1000 levels, difficulty rises by stage: more letters, more words, rarer words, fewer 3-letter words */
const STAGES=[
  {to:100, len:5,n:[6,6],src:'T',min:6,threes:3},
  {to:250, len:6,n:[6,6],src:'T',min:6,threes:2},
  {to:450, len:6,n:[6,7],src:'A',min:7,threes:2},
  {to:700, len:7,n:[7,7],src:'A',min:7,threes:1},
  {to:1000,len:7,n:[8,8],src:'A',min:8,threes:0,long:true}];
const LEVEL_COUNT=1000;

function pickTargets(seed,sub,max,st,rnd,isT){
  const rest=shuffle(sub.filter(w=>w!==seed),rnd);
  // common words first, rarer words only in later stages
  rest.sort((a,b)=>(isT(b)-isT(a)));
  const chosen=[seed];
  for(const w of rest.filter(w=>w.length===3).slice(0,st.threes))if(chosen.length<max)chosen.push(w);
  const pool=rest.filter(w=>w.length>3&&!chosen.includes(w));
  if(st.long)pool.sort((a,b)=>b.length-a.length);
  const byLen=new Map();
  for(const w of pool){if(!byLen.has(w.length))byLen.set(w.length,[]);byLen.get(w.length).push(w);}
  const lens=[...byLen.keys()].sort((a,b)=>b-a);
  let li=0,guard=0;
  while(chosen.length<max&&guard++<400){
    if(!lens.some(l=>byLen.get(l).length))break;
    const g=byLen.get(lens[li++%lens.length]);
    if(g.length)chosen.push(g.shift());
  }
  // still short: allow more 3-letter words
  for(const w of rest)if(chosen.length<max&&!chosen.includes(w))chosen.push(w);
  return chosen.sort((a,b)=>(a.length-b.length)||trCmp(a,b));
}

function genLevels(T,E){
  E=E||[];
  const tS=new Set(T);const isT=w=>tS.has(w)?1:0;
  const infoT=T.map(prep),infoA=infoT.concat(E.map(prep));
  const subOf=(s,src)=>(src==='T'?infoT:infoA).filter(o=>o.len>=3&&fits(o,s.c,s.len)).map(o=>o.w);
  const rnd=mulberry32(20240917);
  const used=new Set(),out=[];
  let prevTo=0;
  for(const st of STAGES){
    const need=st.to-prevTo;prevTo=st.to;
    let got=0;
    // try the stage's own rules first, then relax (wider word source, fewer words) so the count is always reached
    const tries=[[st.src,st.min],['A',st.min],['A',6]];
    for(const [src,min] of tries){
      if(got>=need)break;
      const cands=shuffle((src==='T'?infoT:infoA).filter(o=>o.len===st.len),rnd);
      for(const s of cands){
        if(got>=need)break;
        if(used.has(s.k))continue;
        const sub=subOf(s,src);
        if(sub.length<min)continue;
        used.add(s.k);got++;
        out.push({seed:s.w,sub,st});
      }
    }
  }
  return out.slice(0,LEVEL_COUNT).map((r,i)=>{
    const rnd2=mulberry32((20240917^Math.imul(i+1,2654435761))>>>0);
    const max=r.st.n[0]+Math.floor(rnd2()*(r.st.n[1]-r.st.n[0]+1));
    const targets=pickTargets(r.seed,r.sub,Math.min(8,max),r.st,rnd2,isT);
    let letters=[...r.seed];
    for(let t=0;t<30;t++){shuffle(letters,rnd2);if(letters.join('')!==r.seed)break;}
    const nazar=Math.floor(rnd2()*letters.length);
    return{seed:r.seed,targets,letters,nazar};
  });
}

let AC=null,MG=null;
function ensureAudio(){
  if(!S.settings.sound)return;
  if(!AC){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();MG=AC.createGain();MG.gain.value=.15;MG.connect(AC.destination);}catch(e){AC=null;return;}}
  if(AC.state==='suspended')AC.resume().catch(()=>{});
}
function tone(f,dur,type,when,vol){
  if(!S.settings.sound||!AC)return;
  try{const t=AC.currentTime+(when||0);const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||1,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+.03);}catch(e){}
}

function startLevel(i){
  if(!LEVELS.length)return;
  i=Math.max(0,Math.min(i,LEVELS.length-1));
  const L=LEVELS[i];
  const pc=cnt(L.seed);const tset=new Set(L.targets);
  const bonusAll=new Set();
  for(const o of DICTC)if(o.len>=3&&!tset.has(o.w)&&fits(o,pc,L.seed.length))bonusAll.add(o.w);
  if(!S.cur||S.cur.level!==i){
    // keep half-done progress of the frontier level while an older one is replayed
    if(S.cur&&S.cur.level===S.level)S.front=S.cur;
    if(S.front&&S.front.level===i){S.cur=S.front;delete S.front;}
    else S.cur={level:i,found:[],revealed:{},bonus:[],hints:0};
  }
  const c=S.cur;
  if(c.seed!==L.seed){c.found=[];c.revealed={};c.bonus=[];c.seed=L.seed;}
  c.found=(c.found||[]).filter(w=>tset.has(w));c.bonus=(c.bonus||[]).filter(w=>bonusAll.has(w));
  c.revealed=c.revealed||{};c.hints=c.hints|0;
  G={idx:i,L,tset,bonusAll,found:new Set(c.found),bonus:new Set(c.bonus),sel:[],slot:L.letters.map((_,k)=>k),pos:[],
     busy:false,pid:null,finger:null,tile:58,pillT:0};
  save();
  closeOv('menu');closeOv('win');
  renderGame();
  showScreen('game');
  layout();
  if(G.found.size===L.targets.length){G.busy=true;setTimeout(win,400);}
}
function renderGame(){
  $('#gTitle').textContent='Kilim '+(G.idx+1);
  updateCoins();updateJar();renderLoom();renderTiles();
  const p=$('#pill');p.className='';p.textContent='';
}
function updateCoins(){$('#gCoins').textContent=S.coins;$('#hCoins').textContent=S.coins;}
function updateJar(){const n=S.jar%5;$('#jarFill').style.height=(n/5*100)+'%';$('#jarTxt').textContent=n+'/5';}

function renderLoom(){
  const loom=$('#loom');loom.innerHTML='';
  G.rows=[];
  G.L.targets.forEach((w,r)=>{
    const row=el('div','row');row.style.setProperty('--c',COLORS[r%COLORS.length]);
    const inner=el('div','rowin');inner.appendChild(el('div','stripe'));
    const cells=el('div','cells');
    const solved=G.found.has(w);const rev=S.cur.revealed[r]||[];
    [...w].forEach((ch,j)=>{const c=el('div','cell');
      if(solved){c.classList.add('on');c.textContent=ch;c.style.animation='none';}
      else if(rev.includes(j)){c.classList.add('rev');c.textContent=ch;c.style.animation='none';}
      cells.appendChild(c);});
    if(solved)row.classList.add('solved');
    inner.appendChild(cells);row.appendChild(inner);loom.appendChild(row);G.rows.push(row);
  });
}
function renderTiles(){
  const box=$('#tiles');box.innerHTML='';G.tiles=[];
  G.L.letters.forEach((ch,k)=>{const t=el('div','tile'+(k===G.L.nazar?' nazar':''),ch);box.appendChild(t);G.tiles.push(t);});
}

function layout(){
  if(!G||curScreen!=='game')return;
  const game=$('#game');const W=game.clientWidth,H=game.clientHeight;if(!W||!H)return;
  const top=$('.topbar').offsetHeight,bot=$('.bottombar').offsetHeight,pill=$('#pillwrap').offsetHeight;
  const avail=H-top-bot-pill-8;
  const rows=G.L.targets.length;const n=G.L.letters.length;
  const gap=rows>6?3:5;
  let cell=Math.min(38,Math.floor((W-20-44-6*4)/7));
  let tile=Math.max(46,Math.min(64,Math.floor(W/6.2)));
  const spinIdeal=2*110+tile+24;
  const loomPad=26;
  let loomNeed=rows*(cell+4+gap)+loomPad;
  let spinH=Math.min(spinIdeal,avail-loomNeed);
  const spinMin=Math.min(spinIdeal,Math.max(180,avail*.44));
  if(spinH<spinMin){spinH=spinMin;
    const loomH=avail-spinH;
    cell=Math.max(18,Math.min(cell,Math.floor((loomH-loomPad)/rows-gap-4)));}
  spinH=Math.max(150,Math.floor(spinH));
  let R=Math.min(110,(spinH-tile-14)/2,(W-tile-24)/2);
  const chord=2*R*Math.sin(Math.PI/n)-6;
  if(tile>chord){tile=Math.max(40,Math.floor(chord));R=Math.min(110,(spinH-tile-14)/2,(W-tile-24)/2);}
  const root=game.style;
  root.setProperty('--cell',cell+'px');root.setProperty('--tile',tile+'px');root.setProperty('--gap',gap+'px');
  const spin=$('#spin');spin.style.height=spinH+'px';
  const cx=W/2,cy=spinH/2;G.tile=tile;G.cx=cx;G.cy=cy;
  const ring=$('#ring');const rr=R+tile/2+8;
  ring.style.cssText='width:'+(2*rr)+'px;height:'+(2*rr)+'px;left:'+(cx-rr)+'px;top:'+(cy-rr)+'px';
  const sh=$('#shuf');const sz=Math.max(40,Math.min(52,R*.6));
  sh.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(cx-sz/2)+'px;top:'+(cy-sz/2)+'px;font-size:'+(sz*.55)+'px';
  G.pos=[];for(let s=0;s<n;s++){const a=-Math.PI/2+s*2*Math.PI/n;G.pos.push({x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)});}
  placeTiles();drawThread();
}
function placeTiles(){G.tiles.forEach((t,k)=>{const p=G.pos[G.slot[k]];if(!p)return;t.style.left=(p.x-G.tile/2)+'px';t.style.top=(p.y-G.tile/2)+'px';});}
let rzT=0;
function onResize(){clearTimeout(rzT);rzT=setTimeout(layout,60);}
window.addEventListener('resize',onResize);
if(window.visualViewport)visualViewport.addEventListener('resize',onResize);

/* ---------- tracing ---------- */
const spinEl=$('#spin');
function localPt(e){const r=spinEl.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function hitTile(p,f){const lim=G.tile*f;for(let k=0;k<G.tiles.length;k++){const q=G.pos[G.slot[k]];if(q&&Math.hypot(p.x-q.x,p.y-q.y)<=lim)return k;}return -1;}
function drawThread(){
  const pl=$('#thread polyline');if(!G||!G.sel.length){pl.setAttribute('points','');return;}
  const pts=G.sel.map(k=>{const q=G.pos[G.slot[k]];return q.x.toFixed(1)+','+q.y.toFixed(1);});
  if(G.finger)pts.push(G.finger.x.toFixed(1)+','+G.finger.y.toFixed(1));
  pl.setAttribute('points',pts.join(' '));
}
function selWord(){return G.sel.map(k=>G.L.letters[k]).join('');}
function refreshSel(){
  G.tiles.forEach((t,k)=>t.classList.toggle('sel',G.sel.includes(k)));
  const p=$('#pill');clearTimeout(G.pillT);p.className=G.sel.length?'show':'';p.textContent=selWord();
  drawThread();
}
spinEl.addEventListener('pointerdown',e=>{
  if(!G||G.busy||G.pid!=null)return;
  const p=localPt(e);const k=hitTile(p,.55);if(k<0)return;
  e.preventDefault();
  try{spinEl.setPointerCapture(e.pointerId);}catch(_){}
  G.pid=e.pointerId;G.sel=[k];G.finger=p;refreshSel();SND.add(0);vib(5);
});
spinEl.addEventListener('pointermove',e=>{
  if(!G||e.pointerId!==G.pid)return;
  e.preventDefault();
  const p=localPt(e);G.finger=p;
  const k=hitTile(p,.45);
  if(k>=0){
    if(G.sel.length>=2&&k===G.sel[G.sel.length-2]){G.sel.pop();refreshSel();SND.add(G.sel.length-1);return;}
    if(!G.sel.includes(k)){G.sel.push(k);refreshSel();SND.add(G.sel.length-1);vib(5);return;}
  }
  drawThread();
});
function endTrace(e,cancel){
  if(!G||e.pointerId!==G.pid)return;
  try{spinEl.releasePointerCapture(e.pointerId);}catch(_){}
  G.pid=null;G.finger=null;
  const sel=G.sel.slice();G.sel=[];
  G.tiles.forEach(t=>t.classList.remove('sel'));drawThread();
  if(cancel){$('#pill').className='';return;}
  submit(sel);
}
spinEl.addEventListener('pointerup',e=>endTrace(e,false));
spinEl.addEventListener('pointercancel',e=>endTrace(e,true));
spinEl.addEventListener('lostpointercapture',e=>{if(G&&e.pointerId===G.pid)endTrace(e,false);});
spinEl.addEventListener('contextmenu',e=>e.preventDefault());

function pillState(word,cls,ms){
  const p=$('#pill');p.textContent=word;p.className='';void p.offsetWidth;p.className='show '+cls;
  clearTimeout(G.pillT);G.pillT=setTimeout(()=>{p.className='';},ms||700);
}

/* ---------- submit ---------- */
function submit(sel){
  const word=sel.map(k=>G.L.letters[k]).join('');
  if(word.length<3){$('#pill').className='';return;}
  const nz=sel.includes(G.L.nazar);
  const r=G.L.targets.indexOf(word);
  if(r>=0){
    if(G.found.has(word)){pulse(G.rows[r]);pillState(word,'dup');vib([10,40,10]);SND.dup();return;}
    const pts=word.length*10*(nz?2:1);
    S.score+=pts;
    pillState(word,'ok');
    floatText(G.rows[r],'+'+pts+(nz?' ×2':''),nz);
    solveRow(r,true);
    return;
  }
  if(G.bonusAll.has(word)){
    if(G.bonus.has(word)){pillState(word,'dup');vib([10,40,10]);SND.dup();pulse($('#jarBtn'),'bump');toast('Bu gizli kelimeyi zaten buldun');return;}
    G.bonus.add(word);S.cur.bonus.push(word);S.jar++;
    pillState(word,'bonus',800);flyToJar(word);vib(15);SND.bonus();
    if(S.jar%5===0){S.coins+=10;setTimeout(()=>{updateCoins();toast('Kavanoz doldu! +10 altın');},650);}
    else toast('Gizli kelime! Kavanoza eklendi');
    save();return;
  }
  pillState(word,'bad');vib(60);SND.bad();
}
function pulse(node,cls){cls=cls||'pulse';node.classList.remove(cls);void node.offsetWidth;node.classList.add(cls);setTimeout(()=>node.classList.remove(cls),500);}
function floatText(node,txt,nz){const r=node.getBoundingClientRect();const f=el('div','float'+(nz?' nz':''),txt);
  f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.top-6)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),950);}
function flyToJar(word){
  const a=$('#pill').getBoundingClientRect(),b=$('#jarBtn .jar').getBoundingClientRect();
  const f=el('div','fly',word);document.body.appendChild(f);
  const fw=f.offsetWidth,fh=f.offsetHeight;
  const x0=a.left+a.width/2-fw/2,y0=a.top+a.height/2-fh/2;
  f.style.transform='translate('+x0+'px,'+y0+'px)';void f.offsetWidth;
  f.style.transform='translate('+(b.left+b.width/2-fw/2)+'px,'+(b.top+b.height/2-fh/2)+'px) scale(.2)';f.style.opacity='.2';
  setTimeout(()=>{f.remove();updateJar();pulse($('#jarBtn'),'bump');},620);
}

function solveRow(r,byPlayer){
  const w=G.L.targets[r];if(G.found.has(w))return;
  G.found.add(w);S.cur.found.push(w);delete S.cur.revealed[r];
  save();
  const row=G.rows[r];const cells=[...row.querySelectorAll('.cell')];
  cells.forEach((c,j)=>setTimeout(()=>{c.classList.remove('rev');c.style.animation='';c.textContent=w[j];c.classList.add('on');setTimeout(()=>{c.style.animation='none';},260);},j*60));
  setTimeout(()=>row.classList.add('solved'),RM?0:40);
  vib(20);SND.ok();
  if(G.found.size===G.L.targets.length){G.busy=true;setTimeout(win,Math.max(700,cells.length*60+450));}
}

/* ---------- hints ---------- */
function spend(cost){
  if(S.coins<cost){pulse($('#gCoinbox'),'shake');toast('Yeterli altının yok');vib(60);SND.bad();return false;}
  S.coins-=cost;updateCoins();return true;
}
function unsolved(){return G.L.targets.map((w,r)=>r).filter(r=>!G.found.has(G.L.targets[r]));}
$('#hHint').addEventListener('click',()=>{
  if(!G||G.busy)return;const u=unsolved();if(!u.length)return;
  let r=u[0];for(const x of u)if(G.L.targets[x].length<G.L.targets[r].length)r=x;
  const w=G.L.targets[r];const rev=S.cur.revealed[r]||[];
  const free=[...w].map((_,j)=>j).filter(j=>!rev.includes(j));if(!free.length){solveRow(r,false);return;}
  if(!spend(25))return;
  const j=free[Math.floor(Math.random()*free.length)];
  rev.push(j);S.cur.revealed[r]=rev;S.cur.hints++;save();
  if(rev.length>=w.length){solveRow(r,false);return;}
  const c=G.rows[r].querySelectorAll('.cell')[j];c.textContent=w[j];c.style.animation='';c.classList.add('rev');setTimeout(()=>{c.style.animation='none';},260);
  SND.tap();vib(10);
});
$('#hShuttle').addEventListener('click',()=>{
  if(!G||G.busy)return;const u=unsolved();if(!u.length)return;
  if(!spend(60))return;
  const r=u[Math.floor(Math.random()*u.length)];
  S.cur.hints++;save();
  floatText(G.rows[r],'Mekik!',false);
  solveRow(r,false);
});
function doShuffle(){
  if(!G||G.busy||G.pid!=null)return;
  const n=G.slot.length;const old=G.slot.join(',');
  for(let t=0;t<10;t++){shuffle(G.slot,Math.random);if(G.slot.join(',')!==old)break;}
  placeTiles();SND.tap();vib(8);
}
$('#hFirst').addEventListener('click',()=>{
  if(!G||G.busy)return;
  const opts=[];
  unsolved().forEach(r=>{const w=G.L.targets[r];const rev=S.cur.revealed[r]||[];[...w].forEach((_,j)=>{if(!rev.includes(j))opts.push([r,j]);});});
  if(!opts.length)return;
  if(!spend(15))return;
  const [r,j]=opts[Math.floor(Math.random()*opts.length)];
  const w=G.L.targets[r];const rev=S.cur.revealed[r]||[];rev.push(j);S.cur.revealed[r]=rev;S.cur.hints++;save();
  if(rev.length>=w.length){solveRow(r,false);return;}
  const c=G.rows[r].querySelectorAll('.cell')[j];c.textContent=w[j];c.style.animation='';c.classList.add('rev');setTimeout(()=>{c.style.animation='none';},260);
  SND.tap();vib(10);
});
$('#shuf').addEventListener('click',doShuffle);
$('#jarBtn').addEventListener('click',()=>{const n=S.jar%5;toast('Kavanoz: '+n+'/5 · Bu kilimde '+G.bonus.size+' gizli kelime');});

/* ---------- menu ---------- */
$('#gMenu').addEventListener('click',()=>{syncToggles();openOv('menu');});
$('#mContinue').addEventListener('click',()=>closeOv('menu'));
$('#mMap').addEventListener('click',()=>{closeOv('menu');showScreen('map');});
$('#mHelp').addEventListener('click',()=>{closeOv('menu');openHelp();});
$('#mHome').addEventListener('click',goHome);
$('#menu').addEventListener('click',e=>{if(e.target.id==='menu')closeOv('menu');});

/* ---------- win ---------- */
function win(){
  const idx=G.idx;const h=S.cur?S.cur.hints:0;
  const stars=h===0?3:(h<=2?2:1);
  const first=S.stars[idx]==null;
  const earned=first?10+5*stars:2;
  S.coins+=earned;S.stars[idx]=Math.max(S.stars[idx]||0,stars);
  if(idx>=S.level)S.level=idx+1;
  S.cur=null;save();updateCoins();
  $('#wTitle').textContent=trUp('kilim ')+(idx+1)+' '+trUp('tamamlandı!');
  const wk=$('#winKilim');wk.innerHTML='';wk.appendChild(miniKilim(G.L.targets.length,true));
  $('#wCoins').textContent=earned;
  const ss=$$('#wStars span');ss.forEach(s=>s.classList.remove('on'));
  ss.forEach((s,i)=>{if(i<stars)setTimeout(()=>s.classList.add('on'),600+i*220);});
  $('#wNext').textContent=idx+1<LEVELS.length?'Sonraki Kilim':'Sandığa Git';
  openOv('win');SND.win();vib([30,60,30]);
  confetti();
}
function confetti(){
  if(RM)return;
  const c=el('div','confetti');
  for(let i=0;i<40;i++){const p=el('i');const d=1.6+Math.random()*1.6;
    p.style.cssText='left:'+(Math.random()*100)+'%;background:'+COLORS[i%COLORS.length]+';animation-duration:'+d+'s;animation-delay:'+(Math.random()*.5)+'s;--dx:'+((Math.random()-.5)*160)+'px;--r:'+((Math.random()-.5)*900)+'deg;transform:rotate('+(Math.random()*180)+'deg)';
    c.appendChild(p);}
  document.body.appendChild(c);setTimeout(()=>c.remove(),3800);
}
$('#wNext').addEventListener('click',()=>{
  const nx=G.idx+1;closeOv('win');
  if(nx>=LEVELS.length){toast('Tüm kilimleri dokudun!');showScreen('map');return;}
  startLevel(nx);
});
$('#wHome').addEventListener('click',goHome);

/* ================= init ================= */
syncToggles();
renderHome();
(function daily(){const d=today();if(S.lastDaily!==d){S.lastDaily=d;S.coins+=20;save();renderHome();setTimeout(()=>toast('Günün hediyesi: +20 altın'),500);}})();
if(!S.seenHelp)openHelp();
</script>
